
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M Drishti • स्वदेशी वीडियो पाठशाला</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:#fff;padding:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:100}
.logo{font-size:1.3rem;font-weight:800;color:#38bdf8}.logo span{color:#fff}
.search-bar{flex:1;min-width:180px;display:flex}
.search-bar input{width:100%;padding:7px 10px;border:0;border-radius:16px 0 0 16px;outline:0}
.search-bar button{padding:7px 12px;border:0;background:#2563eb;color:#fff;border-radius:0 16px 16px 0;font-weight:600}
.upload-btn{background:#dc2626;color:#fff;border:0;padding:8px 12px;border-radius:16px;font-weight:700;cursor:pointer}
.categories{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;border-bottom:1px solid #e2e8f0}
.cat-btn{padding:6px 12px;border-radius:14px;border:1px solid #cbd5e1;background:#f8fafc;font-size:0.85rem;white-space:nowrap;font-weight:600}
.cat-btn.active{background:#0f172a;color:#fff}
.container{max-width:1000px;margin:14px auto;padding:0 12px}
.player-section{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.08);margin-bottom:18px}
.video-wrapper{position:relative;padding-bottom:56.25%;height:0;background:#000}
.video-wrapper iframe,.video-wrapper video{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.video-details{padding:14px}
.video-title{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.video-meta{font-size:0.82rem;color:#64748b;margin-bottom:10px}
.channel-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0}
.channel-info{display:flex;align-items:center;gap:8px}
.avatar{width:38px;height:38px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.sub-btn{background:#dc2626;color:#fff;border:0;padding:7px 14px;border-radius:16px;font-weight:700;cursor:pointer}
.sub-btn.subscribed{background:#475569}
.actions{display:flex;gap:8px}
.action-btn{background:#f1f5f9;border:1px solid #cbd5e1;padding:6px 12px;border-radius:14px;font-weight:600;font-size:0.85rem;cursor:pointer}
.earn-bar{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.creator-earn-btn,.platform-ad-btn{flex:1;min-width:200px;text-align:center;color:#fff;text-decoration:none;padding:9px;border-radius:8px;font-weight:700;font-size:0.88rem}
.creator-earn-btn{background:#16a34a}.platform-ad-btn{background:#1d4ed8}
.comments-box{margin-top:14px}
.comment-form{display:flex;gap:6px;margin-top:6px}
.comment-form input{flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:6px}
.comment-form button{background:#0f172a;color:#fff;border:0;padding:8px 14px;border-radius:6px;font-weight:600}
.comment-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.comment-item{background:#f8fafc;padding:7px 10px;border-radius:6px;font-size:0.88rem;border-left:3px solid #38bdf8}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px}
.video-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.06);cursor:pointer}
.thumb{height:130px;background:#1e293b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;padding:10px;text-align:center;position:relative}
.badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.8);font-size:0.75rem;padding:2px 6px;border-radius:4px}
.card-body{padding:10px}.card-title{font-weight:700;font-size:0.92rem;margin-bottom:4px}.card-meta{font-size:0.78rem;color:#64748b}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:12px}
.modal-content{background:#fff;max-width:440px;width:100%;padding:16px;border-radius:10px}
.form-group{margin-bottom:8px}.form-group label{display:block;font-size:0.82rem;font-weight:600;margin-bottom:3px}
.form-group input,.form-group select{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px}
footer{text-align:center;padding:18px;color:#64748b;font-size:0.82rem;margin-top:24px}
</style>
</head>
<body>
<header>
<div class="logo">👁️ M <span>Drishti</span></div>
<div class="search-bar"><input id="searchInput" placeholder="खोजें..."><button onclick="renderGrid()">खोजें</button></div>
<button class="upload-btn" onclick="document.getElementById('uploadModal').style.display='flex'">+ वीडियो डालें</button>
</header>
<div class="categories">
<button class="cat-btn active" onclick="setCat('all',this)">सभी वीडियो</button>
<button class="cat-btn" onclick="setCat('coding',this)">💻 Hinglish कोडिंग</button>
<button class="cat-btn" onclick="setCat('news',this)">📰 समाचार</button>
<button class="cat-btn" onclick="setCat('education',this)">📚 शिक्षा</button>
</div>
<div class="container">
<div class="player-section">
<div class="video-wrapper" id="playerContainer"></div>
<div class="video-details">
<div class="video-title" id="currentTitle"></div>
<div class="video-meta" id="currentMeta"></div>
<div class="channel-bar">
<div class="channel-info">
<div class="avatar" id="channelAvatar">M</div>
<div><div style="font-weight:700" id="channelName"></div><div style="font-size:0.78rem;color:#64748b"><span id="subCount">0</span> Subscribers</div></div>
<button class="sub-btn" id="subBtn" onclick="toggleSub()">Subscribe</button>
</div>
<div class="actions">
<button class="action-btn" onclick="likeVid()">👍 Like (<span id="likeCount">0</span>)</button>
<button class="action-btn" onclick="shareVid()">🔗 Share</button>
</div>
</div>
<div class="earn-bar">
<a href="#" id="creatorSupportLink" target="_blank" class="creator-earn-btn">❤️ क्रिएटर को सहयोग</a>
<a href="https://github.io" target="_blank" class="platform-ad-btn">📰 Malik News • ताज़ा समाचार</a>
</div>
<div class="comments-box">
<div style="font-weight:700;font-size:0.9rem">💬 टिप्पणियां</div>
<div class="comment-form"><input id="commentInput" placeholder="अपना विचार लिखें..."><button onclick="addComm()">भेजें</button></div>
<div class="comment-list" id="commentList"></div>
</div>
</div>
</div>
<div style="font-weight:700">📺 अन्य वीडियो एवं कोडिंग पाठशाला</div>
<div class="video-grid" id="videoGrid"></div>
</div>
<div class="modal" id="uploadModal">
<div class="modal-content">
<h3 style="margin-bottom:10px">📤 अपना वीडियो जोड़ें</h3>
<div class="form-group"><label>चैनल का नाम *</label><input id="upChannel"></div>
<div class="form-group"><label>वीडियो शीर्षक *</label><input id="upTitle"></div>
<div class="form-group"><label>कैटेगरी</label><select id="upCategory"><option value="coding">Hinglish कोडिंग</option><option value="news">समाचार</option><option value="education">शिक्षा</option></select></div>
<div class="form-group"><label>YouTube या MP4 लिंक *</label><input id="upUrl"></div>
<div class="form-group"><label>कमाई / UPI / वेबसाइट लिंक</label><input id="upEarnLink"></div>
<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
<button class="action-btn" onclick="document.getElementById('uploadModal').style.display='none'">रद्द करें</button>
<button class="upload-btn" onclick="submitVid()">पब्लिश करें</button>
</div>
</div>
</div>
<footer>© 2026 M Drishti (Malik Ecosystem) • संस्थापक: शैलेन्द्र कुमार सिंह</footer>
<script>
const U_GH = "https://github.com" + "shailendra-codes/";
const U_IO = "https://shailendra-codes" + ".github.io/";
const defVids = [
  {id:"v1", title:"MalikLang पाठ 1: बिना अंग्रेजी अपनी भाषा Hinglish में कोडिंग सीखें", channel:"MalikLang Official", category:"coding", views:425, likes:72, subs:145, url:"https://w3schools.com", earnLink: U_GH + "Maliklang", earnText:"🚀 MalikLang फ्री डाउनलोड करें", date:"आज", comments:["अमित: गांव के छात्रों के लिए शानदार पहल!"]},
  {id:"v2", title:"Malik News बुलेटिन: भारत-नेपाल रेल सेवा एवं आज के मुख्य समाचार", channel:"Malik News डेस्क", category:"news", views:318, likes:51, subs:212, url:"https://w3schools.com", earnLink: U_IO + "Malik-News/", earnText:"📰 Malik News पर पूरा अंक पढ़ें", date:"आज", comments:[]},
  {id:"v3", title:"MalikBooks मंच: हिंदी और हिंग्लिश लेखक अपनी किताब मुफ्त पब्लिश करें", channel:"MalikBooks प्रकाशन", category:"education", views:198, likes:36, subs:99, url:"https://w3schools.com", earnLink: U_IO + "MalikBooks/", earnText:"📚 MalikBooks पर जाएं", date:"कल", comments:[]}
];
let vids = JSON.parse(localStorage.getItem("md_v5")) || defVids;
let cur = vids.at(0), cat = "all", subs = JSON.parse(localStorage.getItem("md_s5")) || {};
function fmtUrl(u){if(u.includes("v="))return"https://youtube.com"+u.split("v=").at(1).split("&").at(0);if(u.includes("youtu.be/"))return"https://youtube.com"+u.split("youtu.be/").at(1).split("?").at(0);return u}
function loadV(v){cur=v;v.views++;save();const u=fmtUrl(v.url);document.getElementById("playerContainer").innerHTML=u.endsWith(".mp4")?`<video controls src="${u}"></video>`:`<iframe src="${u}" allowfullscreen></iframe>`;document.getElementById("currentTitle").textContent=v.title;document.getElementById("currentMeta").textContent=v.views+" Views • "+v.date;document.getElementById("channelName").textContent=v.channel;document.getElementById("channelAvatar").textContent=v.channel.at(0);document.getElementById("subCount").textContent=v.subs;document.getElementById("likeCount").textContent=v.likes;const b=document.getElementById("creatorSupportLink");b.href=v.earnLink;b.textContent=v.earnText;document.querySelector(".platform-ad-btn").href=U_IO+"Malik-News/";updSub();renComm()}
function updSub(){const b=document.getElementById("subBtn");b.textContent=subs[cur.channel]?"Subscribed ✓":"Subscribe";b.className=subs[cur.channel]?"sub-btn subscribed":"sub-btn"}
function toggleSub(){subs[cur.channel]?(delete subs[cur.channel],cur.subs--):(subs[cur.channel]=1,cur.subs++);localStorage.setItem("md_s5",JSON.stringify(subs));document.getElementById("subCount").textContent=cur.subs;updSub();save()}
function likeVid(){cur.likes++;document.getElementById("likeCount").textContent=cur.likes;save()}
function shareVid(){navigator.clipboard.writeText(cur.title+" - "+location.href);alert("लिंक कॉपी हो गया!")}
function renComm(){document.getElementById("commentList").innerHTML=cur.comments.length?cur.comments.map(c=>`<div class="comment-item">${c}</div>`).join(""):"<div style='font-size:0.82rem;color:#64748b'>अभी कोई टिप्पणी नहीं है।</div>"}
function addComm(){const i=document.getElementById("commentInput");if(!i.value.trim())return;cur.comments.unshift("पाठक: "+i.value.trim());i.value="";save();renComm()}
function renderGrid(){const q=document.getElementById("searchInput").value.toLowerCase();document.getElementById("videoGrid").innerHTML=vids.filter(v=>(cat==="all"||v.category===cat)&&(v.title.toLowerCase().includes(q)||v.channel.toLowerCase().includes(q))).map(v=>`<div class="video-card" onclick="pickV('${v.id}')"><div class="thumb"><span>▶️ ${v.title.slice(0,45)}...</span><div class="badge">${v.views} Views</div></div><div class="card-body"><div class="card-title">${v.title}</div><div class="card-meta">${v.channel} • ${v.likes} Likes</div></div></div>`).join("")}
function pickV(id){const f=vids.find(x=>x.id===id);if(f){loadV(f);scrollTo({top:0,behavior:"smooth"})}}
function setCat(c,b){cat=c;document.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderGrid()}
function submitVid(){const c=document.getElementById("upChannel").value.trim(),t=document.getElementById("upTitle").value.trim(),u=document.getElementById("upUrl").value.trim(),e=document.getElementById("upEarnLink").value.trim();if(!c||!t||!u)return alert("कृपया सभी ज़रूरी जानकारी भरें!");const n={id:"v"+Date.now(),title:t,channel:c,category:document.getElementById("upCategory").value,views:1,likes:1,subs:1,url:u,earnLink:e||(U_IO+"Malik-News/"),earnText:e?"❤️ क्रिएटर को सहयोग":"📰 Malik News",date:"अभी",comments:[]};vids.unshift(n);save();document.getElementById('uploadModal').style.display='none';renderGrid();loadV(n)}
function save(){localStorage.setItem("md_v5",JSON.stringify(vids))}
loadV(cur);renderGrid();
  
const GOOD_MP4 = "https://www.w3schools" + ".com/html/mov_bbb.mp4";
vids.forEach(x => { if (!x.url.includes("mov_bbb")) x.url = GOOD_MP4; }); loadV(vids.at(0));
document.querySelector('footer').innerHTML += '<div style="margin-top:6px;font-weight:700;color:#0f172a">👁️ कुल दर्शक: <span id="md-vc">1</span></div>';
fetch('https://counterapi.dev').then(r=>r.json()).then(d=>{document.getElementById('md-vc').textContent=d.count});
 
</script>
</body>
</html>
