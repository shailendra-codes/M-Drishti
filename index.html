
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f1f5f9; color: #0f172a; }
        header { background: #0f172a; color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .logo { font-size: 1.35rem; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
        .logo span { color: #fff; }
        .search-bar { flex: 1; min-width: 200px; max-width: 420px; display: flex; }
        .search-bar input { width: 100%; padding: 8px 12px; border: none; border-radius: 20px 0 0 20px; outline: none; font-size: 0.92rem; }
        .search-bar button { padding: 8px 14px; border: none; background: #2563eb; color: #fff; border-radius: 0 20px 20px 0; cursor: pointer; font-weight: 600; }

        .video-wrapper iframe, .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-details { padding: 16px; }
        .video-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
        .video-meta { font-size: 0.85rem; color: #64748b; margin-bottom: 12px; }
        .channel-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        .channel-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; }
        .sub-btn { background: #dc2626; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .sub-btn.subscribed { background: #475569; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .action-btn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 7px 13px; border-radius: 18px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .earn-bar { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
        .creator-earn-btn { flex: 1; min-width: 220px; text-align: center; background: #16a34a; color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
        .platform-ad-btn { flex: 1; min-width: 220px; text-align: center; background: #1d4ed8; color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
        .comments-box { margin-top: 16px; }
        .comment-form { display: flex; gap: 8px; margin-top: 8px; }
        .comment-form input { flex: 1; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .comment-form button { background: #0f172a; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .comment-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .comment-item { background: #f8fafc; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; border-left: 3px solid #38bdf8; }
        .grid-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .video-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.15s; }
        .video-card:hover { transform: translateY(-3px); }
        .thumb { height: 150px; background: #1e293b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; padding: 12px; text-align: center; position: relative; }
        .badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; }
        .card-body { padding: 12px; }
        .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
        .card-meta { font-size: 0.8rem; color: #64748b; }
        /* Upload Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
        .modal-content { background: #fff; max-width: 480px; width: 100%; padding: 20px; border-radius: 12px; }
        .modal-content h3 { margin-bottom: 12px; color: #0f172a; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
        footer { text-align: center; padding: 20px; color: #64748b; font-size: 0.85rem; margin-top: 30px; }
    </style>
</head>

<header>
    <div class="logo">👁️ M <span>Drishti</span></div>
    <div class="search-bar">

                <div class="comment-form">
                    <input type="text" id="commentInput" placeholder="अपना सवाल या विचार लिखें...">
                    <button onclick="addComment()">भेजें</button>
                </div>
                <div class="comment-list" id="commentList"></div>
            </div>
        </div>
    </div>

    <div class="grid-title">📺 अन्य वीडियो एवं कोडिंग पाठशाला</div>
    <div class="video-grid" id="videoGrid"></div>
</div>
